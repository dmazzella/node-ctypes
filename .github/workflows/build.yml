name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      # - '.github/**'
  pull_request:
    branches: [main]

jobs:
  # Type-checks lib/index.d.ts against tests/types (no native build needed).
  types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Check TypeScript declarations
        run: npm run test:types

  build:
    runs-on: ${{ matrix.os }}
    env:
      # Minimum macOS of the prebuilt binaries (Node 24 supports macOS 13.5+);
      # without it they require the macOS version of the runner.
      MACOSX_DEPLOYMENT_TARGET: "13.5"
    strategy:
      fail-fast: false
      matrix:
        # Linux binaries are built and tested in containers: manylinux_2_28
        # (glibc 2.28, the minimum of Node 24) and Alpine for musl. The
        # binaries require the libc of the build image, not of the runner.
        include:
          - os: windows-latest
            artifact: win32-x64
          - os: windows-11-arm
            artifact: win32-arm64
          - os: ubuntu-24.04
            artifact: linux-x64
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: ubuntu-24.04
            artifact: linux-x64-musl
            container: node:24-alpine
          - os: ubuntu-24.04-arm
            artifact: linux-arm64-musl
            container: node:24-alpine
          - os: macos-latest
            artifact: darwin-arm64
          - os: macos-15-intel
            artifact: darwin-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        if: ${{ !matrix.container }}
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        if: ${{ !matrix.container }}
        run: npm install

      - name: Generate FFI headers
        if: ${{ !matrix.container }}
        run: npm run generate-ffi-headers

      - name: Build
        if: ${{ !matrix.container }}
        run: npm run build

      - name: Run tests
        if: ${{ !matrix.container }}
        run: |
          cd tests
          npm install
          npm test

      - name: Build and test in ${{ matrix.container }}
        if: ${{ matrix.container }}
        run: docker run --rm -v "$PWD:/work" -w /work ${{ matrix.container }} sh .github/scripts/build-linux.sh

      - name: Check glibc requirements
        if: ${{ startsWith(matrix.container, 'quay.io/pypa/manylinux') }}
        run: |
          max() { objdump -T build/Release/ctypes.node | grep -oE "$1_[0-9]+(\.[0-9]+)*" | sed "s/^$1_//" | sort -uV | tail -1; }
          check() {
            echo "$1: requires ${2:-none}, allowed up to $3"
            if [ -n "$2" ] && [ "$(printf '%s\n%s\n' "$2" "$3" | sort -V | tail -1)" != "$3" ]; then
              echo "::error::ctypes.node requires $1 $2 (> $3)"
              exit 1
            fi
          }
          check GLIBC "$(max GLIBC)" 2.28
          check GLIBCXX "$(max GLIBCXX)" 3.4.25

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ctypes-${{ matrix.artifact }}
          path: build/Release/ctypes.node

  package:
    needs: [build, types]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Assemble multi-platform package
        run: |
          mkdir -p package/lib
          mkdir -p package/build/Release
          
          # Copy platform-specific binaries
          for dir in artifacts/ctypes-*; do
            if [ -d "$dir" ]; then
              platform=$(basename "$dir" | sed 's/ctypes-//')
              cp "$dir/ctypes.node" "package/build/Release/ctypes-${platform}.node"
            fi
          done
          
          # Copy source files
          cp -r lib/* package/lib/
          cp package.json README.md LICENSE package/

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v6
        with:
          name: node-ctypes
          path: package/

  publish:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v7
        with:
          name: node-ctypes
          path: package

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Publish to npm
        run: |
          cd package
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
