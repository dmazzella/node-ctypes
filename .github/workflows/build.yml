name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "README.md"
      # - '.github/**'
  pull_request:
    branches: [main]

jobs:
  # Type-checks lib/index.d.ts against tests/types (no native build needed).
  types:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { releaseTag } from './.github/scripts/package.mjs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          releaseTag(manifest.version, process.env.GITHUB_REF);
          NODE

      - name: Check TypeScript declarations
        run: npm run test:types

  build:
    runs-on: ${{ matrix.os }}
    env:
      # Minimum macOS of the prebuilt binaries (Node 24 supports macOS 13.5+);
      # without it they require the macOS version of the runner.
      MACOSX_DEPLOYMENT_TARGET: "13.5"
    strategy:
      fail-fast: false
      matrix:
        # Linux binaries are built and tested in containers: manylinux_2_28
        # (glibc 2.28, the minimum of Node 24) and Alpine for musl. The
        # binaries require the libc of the build image, not of the runner.
        include:
          - os: windows-latest
            artifact: win32-x64
          - os: windows-11-arm
            artifact: win32-arm64
          - os: ubuntu-24.04
            artifact: linux-x64
            container: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            container: quay.io/pypa/manylinux_2_28_aarch64
          - os: ubuntu-24.04
            artifact: linux-x64-musl
            container: node:24-alpine
          - os: ubuntu-24.04-arm
            artifact: linux-arm64-musl
            container: node:24-alpine
          - os: macos-latest
            artifact: darwin-arm64
          - os: macos-15-intel
            artifact: darwin-x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Node.js
        if: ${{ !matrix.container }}
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Check native artifact target
        if: ${{ !matrix.container }}
        run: node -e "require('node:assert/strict').equal(process.platform+'-'+process.arch,'${{ matrix.artifact }}');"

      - name: Install dependencies
        if: ${{ !matrix.container }}
        run: npm install

      - name: Generate FFI headers
        if: ${{ !matrix.container }}
        run: npm run generate-ffi-headers

      - name: Build
        if: ${{ !matrix.container }}
        run: npm run build

      - name: Run tests
        if: ${{ !matrix.container }}
        run: |
          cd tests
          npm install
          npm test

      - name: Run tests without external buffers (as in Electron)
        if: ${{ !matrix.container }}
        env:
          NODE_CTYPES_NO_EXTERNAL_BUFFERS: "1"
        run: |
          cd tests
          npm test

      # Run paired parity cases and existing references with Python ctypes.
      # Version-specific contracts use Python 3.14+.
      - name: Setup Python
        if: ${{ !matrix.container }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Run Python ctypes reference tests
        if: ${{ !matrix.container }}
        run: |
          cd tests
          npm run test:python

      - name: Build and test in ${{ matrix.container }}
        if: ${{ matrix.container }}
        run: docker run --rm -v "$PWD:/work" -w /work ${{ matrix.container }} sh .github/scripts/build-linux.sh

      - name: Check glibc requirements
        if: ${{ startsWith(matrix.container, 'quay.io/pypa/manylinux') }}
        run: |
          max() { objdump -T build/Release/ctypes.node | grep -oE "$1_[0-9]+(\.[0-9]+)*" | sed "s/^$1_//" | sort -uV | tail -1; }
          check() {
            echo "$1: requires ${2:-none}, allowed up to $3"
            if [ -n "$2" ] && [ "$(printf '%s\n%s\n' "$2" "$3" | sort -V | tail -1)" != "$3" ]; then
              echo "::error::ctypes.node requires $1 $2 (> $3)"
              exit 1
            fi
          }
          check GLIBC "$(max GLIBC)" 2.28
          check GLIBCXX "$(max GLIBCXX)" 3.4.25

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ctypes-${{ matrix.artifact }}
          path: build/Release/ctypes.node

      - name: Upload test fixture
        uses: actions/upload-artifact@v6
        with:
          name: fixture-${{ matrix.artifact }}
          path: build/fixture/ctypes_test_fixture.*
          if-no-files-found: error

  package:
    needs: [build, types]
    runs-on: ubuntu-latest
    outputs:
      filename: ${{ steps.pack.outputs.filename }}
      npm_tag: ${{ steps.pack.outputs.npm_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Assemble multi-platform package
        run: node .github/scripts/package.mjs artifacts package

      - name: Pack the distribution
        id: pack
        run: |
          npm pack ./package --json > pack.json
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const [packed] = JSON.parse(readFileSync('pack.json', 'utf8'));
          const manifest = JSON.parse(readFileSync('package/package.json', 'utf8'));
          const prerelease = manifest.version.split('+')[0].includes('-');
          appendFileSync(process.env.GITHUB_OUTPUT, `filename=${packed.filename}\nnpm_tag=${prerelease ? 'next' : 'latest'}\n`);
          NODE

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v6
        with:
          name: node-ctypes
          path: ${{ steps.pack.outputs.filename }}
          if-no-files-found: error

  runtime:
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: win32-x64
          - os: macos-latest
            artifact: darwin-arm64
          - os: ubuntu-24.04
            artifact: linux-x64
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js control
        uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Download Node 24 addon for source-suite control
        uses: actions/download-artifact@v7
        with:
          name: ctypes-${{ matrix.artifact }}
          path: build/Release

      - name: Download compiled fixture
        uses: actions/download-artifact@v7
        with:
          name: fixture-${{ matrix.artifact }}
          path: build/fixture

      - name: Install test dependencies
        run: |
          npm install
          npm --prefix tests install

      - name: Run full source suite on Node 26 without rebuilding the addon
        run: npm --prefix tests run test:js

      - name: Run full Node 26 source suite without external buffers
        env:
          NODE_CTYPES_NO_EXTERNAL_BUFFERS: "1"
        run: npm --prefix tests run test:js

      - name: Setup Python 3.15 reference control
        if: matrix.artifact == 'linux-x64'
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: Run Python 3.15 parity cases and reference tests
        if: matrix.artifact == 'linux-x64'
        run: npm --prefix tests run test:python

  publish:
    needs: [package, runtime]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download package
        uses: actions/download-artifact@v7
        with:
          name: node-ctypes
          path: package

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Publish to npm
        run: npm publish "./package/${{ needs.package.outputs.filename }}" --tag "${{ needs.package.outputs.npm_tag }}" --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
